name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ------------------------------------------------------------
  # Джоба 1: запуск автотестов и сохранение allure-results
  # ------------------------------------------------------------
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # Сохраняем папку с результатами как артефакт,
      # чтобы передать её в следующую джобу.
      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  # ------------------------------------------------------------
  # Джоба 2: публикация отчёта Allure на GitHub Pages
  # Запускается только после успешного завершения run-tests
  # ------------------------------------------------------------
  publish-report:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      # Загружаем артефакт с результатами тестов,
      # сохранённый в джобе run-tests.
      - name: Download Allure results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # Получаем историю отчётов из ветки gh-pages (если она существует).
      - name: Get Allure history
        uses: actions/checkout@v6
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Генерируем отчёт Allure с учётом истории.
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      # Публикуем готовый отчёт на GitHub Pages.
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history